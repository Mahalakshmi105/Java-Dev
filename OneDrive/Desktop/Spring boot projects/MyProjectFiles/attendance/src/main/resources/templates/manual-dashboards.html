<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manual Check-in/Check-out</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; text-align: center; padding: 50px; }
        .container { background: white; padding: 30px; border-radius: 10px; box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1); display: inline-block; }
        h2 { color: #2d8cf0; }
        label { display: block; margin-bottom: 5px; }
        input { padding: 10px; margin-bottom: 10px; width: 100%; border: 1px solid #ccc; border-radius: 5px; }
        button { padding: 10px 20px; background: #2d8cf0; color: white; border: none; border-radius: 5px; cursor: pointer; }
        button:hover { background: #1c6ebf; }
        a { display: block; margin-top: 20px; text-decoration: none; color: #2d8cf0; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Manual Check-in/Check-out</h2>
        <form action="/employee/manual-check-in" method="post">
            <label for="username">Enter Username:</label>
            <input type="text" id="username" name="username" required>
            <button type="submit">Manual Check-in</button>
        </form>
        <br>
        <form action="/employee/manual-check-out" method="post">
            <label for="username">Enter Username:</label>
            <input type="text" id="username" name="username" required>
            <button type="submit">Manual Check-out</button>
        </form>
        <a href="/employee/dashboard">Back to Employee Dashboard</a>
    </div>
</body>
</html>
